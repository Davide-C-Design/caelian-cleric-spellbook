<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caelian Vàel · Cleric Spellbook</title>
<meta name="description" content="Caelian Vàel's D&D 3.5 Cleric spellbook.">
<link rel="stylesheet" href="css/styles.css?v=20260922-2">
<style>
.header-tools{display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;padding:0;line-height:1;}
.settings-icon{display:block;width:1.25rem;height:1.25rem;flex:0 0 auto;fill:currentColor;}
</style>
</head>
<body>
<header><div class="top">
<div class="title"><h1>Caelian Vàel · Spellbook</h1><p>D&D 3.5 · Cleric 5 · Wisdom 23 (+6)</p></div>
<div class="badges"><span class="badge">Magic</span><span class="badge">Balance</span><span class="badge" id="preparedBadge">0 prepared</span><button class="header-tools" id="mobileToolsButton" type="button" aria-label="Open character and slot controls">⚙</button></div>
</div>
<nav id="tabs" aria-label="Spellbook sections"><button class="tab active" data-tab="cleric">Cleric</button><button class="tab" data-tab="magic">Magic Domain</button><button class="tab" data-tab="balance">Balance Domain</button><button class="tab" data-tab="today">Prepared Today</button></nav></header>
<main>
<div class="toolbar"><input id="search" class="search" type="search" aria-label="Search spells" placeholder="Search spells…"><select id="levelFilter" class="select" aria-label="Filter by spell level"><option value="all">All levels</option></select><select id="preparedFilter" class="select" aria-label="Filter prepared spells"><option value="all">All spells</option><option value="prepared">Prepared only</option><option value="unprepared">Unprepared only</option></select></div>
<div class="grid"><section id="content" class="levels" aria-live="polite"></section><aside><div class="detail" id="detail"><h2>Choose a spell</h2><p>Select any spell to see its quick-reference information.</p></div></aside></div>
<div class="settings"><h3>Character</h3><div class="settingsrow"><label>Cleric level <input id="charLevel" type="number" min="1" max="20" value="5"></label><label>Wisdom <input id="wis" type="number" min="1" max="60" value="23"></label></div><div class="meta"></div><div id="slots"></div></div>
</main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="mobile-tools-backdrop" id="mobileToolsBackdrop"></div>
<section class="mobile-tools-drawer" id="mobileToolsDrawer" aria-label="Character and slot controls" aria-hidden="true"><header><h2>Character &amp; Slots</h2><button class="mobile-close" id="mobileToolsClose" type="button">×</button></header><label>Cleric level <input id="mobileCharLevel" type="number" min="1" max="20" value="5"></label><label>Wisdom <input id="mobileWis" type="number" min="1" max="60" value="23"></label><p class="meta" id="mobileCharacterNote"></p><div id="mobileSlots"></div></section>
<script src="js/spells.js?v=20260922-2"></script>
<script src="js/app.js?v=20260922-2"></script>
<script src="js/innate.js?v=20260924-1"></script>
</body></html>
